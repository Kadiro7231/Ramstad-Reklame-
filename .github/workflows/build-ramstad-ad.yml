name: Build Ramstad Reklame real-footage commercial

on:
  push:
    branches:
      - video/ramstad-commercial-20s
    paths:
      - scripts/build_ramstad_ad.py
      - .github/workflows/build-ramstad-ad.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/build_ramstad_ad.py
      - .github/workflows/build-ramstad-ad.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install no-cost local video production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil curl
      - name: Download licensed real footage and render branded 20-second MP4
        run: python3 scripts/build_ramstad_ad.py
      - name: Archive final video for download
        uses: actions/upload-artifact@v4
        with:
          name: ramstad-reklame-real-video-20s
          path: docs/media/ramstad-reklame-real-video-20s.mp4
          retention-days: 30
      - name: Save finished video on this branch
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/ramstad-reklame-real-video-20s.mp4
          git commit -m "Render 20s Ramstad Reklame stock video commercial"
          git push origin HEAD:video/ramstad-commercial-20s
